name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_COMMIT: 3cdb8b59d9aa7569b3b9ae6df5f1b05ce93b50d2

jobs:
  build:
    name: Build (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: mediatek
            config: ci-mediatek.config
          - name: ipq40xx
            config: ci-ipq40xx.config
          - name: ramips
            config: ci-ramips.config

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v6

      - name: Checkout OpenWrt
        uses: actions/checkout@v6
        with:
          repository: openwrt/openwrt
          ref: ${{ env.OPENWRT_COMMIT }}
          path: openwrt
          fetch-depth: 1

      - name: Allow git in CI
        run: git config --global --add safe.directory '*'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Overlay packages into OpenWrt tree
        run: cp -a package/. openwrt/package/

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          sed -i 's/PKG_BUILD_FLAGS:=no-mips16 gc-sections lto/PKG_BUILD_FLAGS:=no-mips16 gc-sections/' feeds/packages/libs/boost/Makefile
          ! grep -q "PKG_BUILD_FLAGS:=.*\blto\b" feeds/packages/libs/boost/Makefile
          sed -i 's/$(if $(CONFIG_PACKAGE_boost-locale),boost.locale.std=off boost.locale.posix=off)/$(if $(CONFIG_PACKAGE_boost-locale),boost.locale.icu=off boost.locale.std=on boost.locale.posix=on)/' feeds/packages/libs/boost/Makefile
          grep -q 'boost.locale.icu=off' feeds/packages/libs/boost/Makefile
          ./scripts/feeds install -a

      - name: Configure
        working-directory: openwrt
        run: |
          cp ../${{ matrix.target.config }} .config
          make defconfig
          sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\(.*\)"/target arch: \1/p' .config

      - name: Check tag matches PKG_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg=$(sed -n 's/^PKG_VERSION:=//p' package/openwrt-fptn/fptn-client/Makefile)
          tag=${GITHUB_REF_NAME#v}
          echo "tag=$tag PKG_VERSION=$pkg"
          [ "$tag" = "$pkg" ]

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.OPENWRT_COMMIT }}-${{ hashFiles('package/**/Makefile') }}
          restore-keys: |
            dl-${{ env.OPENWRT_COMMIT }}-
            dl-

      - name: Build toolchain
        working-directory: openwrt
        run: |
          make tools/install -j"$(nproc)"
          make toolchain/install -j"$(nproc)"

      - name: Build kernel
        working-directory: openwrt
        run: |
          make target/linux/compile -j"$(nproc)"
          make package/kernel/linux/compile -j"$(nproc)"

      - name: Build packages
        working-directory: openwrt
        run: |
          make package/openwrt-fptn/fptn-client/compile -j"$(nproc)" V=sc
          make package/openwrt-fptn/fptn-client-slim/compile -j"$(nproc)" V=sc
          make package/openwrt-fptn/luci-app-fptn/compile -j"$(nproc)" V=sc

      - name: Build image
        working-directory: openwrt
        run: |
          grep -q '^CONFIG_TARGET_ramips_mt76x8_DEVICE_xiaomi_mi-router-4c=y$' .config || exit 0
          sed -i -e 's/^CONFIG_PACKAGE_boost=.*/# CONFIG_PACKAGE_boost is not set/' \
                 -e 's/^CONFIG_PACKAGE_googletest=.*/# CONFIG_PACKAGE_googletest is not set/' .config
          make defconfig
          make -j"$(nproc)" V=sc
          echo "=== built images ==="
          find bin/targets/ramips/mt76x8 -maxdepth 1 -type f -name '*xiaomi_mi-router-4c*' -exec ls -la {} \;
          [ -n "$(find bin/targets/ramips/mt76x8 -maxdepth 1 -type f -name '*squashfs-sysupgrade.bin')" ] || { echo 'ERROR: sysupgrade image missing' >&2; exit 1; }

      - name: Collect artifacts
        run: |
          set -eu
          arch=$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\(.*\)"/\1/p' openwrt/.config)
          echo "arch=$arch"
          [ -n "$arch" ]
          pkgver=$(sed -n 's/^PKG_VERSION:=//p' package/openwrt-fptn/fptn-client/Makefile)
          echo "pkgver=$pkgver"
          mkdir -p dist
          find openwrt/bin/packages \( -name 'fptn-client-*.apk' -o -name 'luci-app-fptn-*.apk' \) > files.txt
          cat files.txt
          [ -s files.txt ]
          while read -r f; do
            base=$(basename "$f")
            cp "$f" "dist/${base%.apk}_${arch}.apk"
          done < files.txt
          # реальные unpacked-размеры (для проверки места на роутере)
          : > dist/sizes.txt
          if [ -x openwrt/staging_dir/host/bin/apk ]; then
            for a in dist/*.apk; do
              [ -e "$a" ] || continue
              t=$(mktemp -d)
              ( cd "$t" && "$GITHUB_WORKSPACE/openwrt/staging_dir/host/bin/apk" --allow-untrusted extract --no-chown "$GITHUB_WORKSPACE/$a" >/dev/null 2>&1 )
              sz=$(find "$t" -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
              printf '%s %s\n' "$(basename "$a")" "$sz" >> dist/sizes.txt
              rm -rf "$t"
            done
          fi
          cat dist/sizes.txt
          # zip на архитектуру: fptn-<ver>-<arch>.zip (apk + sizes.txt)
          zipfiles="sizes.txt"
          for f in dist/*.apk; do
            [ -e "$f" ] || continue
            zipfiles="$zipfiles $(basename "$f")"
          done
          ( cd dist && python3 -m zipfile -c "fptn-${pkgver}-${arch}.zip" $zipfiles )
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.target.name }}
          path: |
            dist/*.apk
            dist/*.zip
            dist/sizes.txt
          if-no-files-found: error

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target.name }}
          path: |
            openwrt/bin/targets/ramips/mt76x8/*xiaomi_mi-router-4c*
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ls -la dist
          repo="$GITHUB_REPOSITORY"
          if gh release view "$GITHUB_REF_NAME" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/*.zip --repo "$repo" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk dist/*.zip --repo "$repo" --title "$GITHUB_REF_NAME" --generate-notes
          fi
