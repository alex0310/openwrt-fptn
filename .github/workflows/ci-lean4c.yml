name: Lean 4C image experiment

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_COMMIT: 3cdb8b59d9aa7569b3b9ae6df5f1b05ce93b50d2
  # Rust client source used to cross-build the prebuilt mipsel binary.
  FPTN_RS_REPO: alex0310/fptn-client-rs
  FPTN_RS_REF: main

jobs:
  build:
    name: Build lean 4C image
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ env.OPENWRT_COMMIT }}
          path: openwrt
          fetch-depth: 1

      - name: Allow git in CI
        run: git config --global --add safe.directory '*'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Require FPTN_RS_TOKEN
        env:
          HAVE_TOKEN: ${{ secrets.FPTN_RS_TOKEN != '' }}
        run: |
          [ "$HAVE_TOKEN" = "true" ] || {
            echo "::error::Secret FPTN_RS_TOKEN is not set; cannot clone the private $FPTN_RS_REPO."
            exit 1
          }

      - name: Checkout fptn-client-rs
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FPTN_RS_REPO }}
          ref: ${{ env.FPTN_RS_REF }}
          path: fptn-rs
          # fptn-client-rs is private; the default GITHUB_TOKEN is scoped to this
          # repository and cannot read it. FPTN_RS_TOKEN is a fine-grained PAT
          # with Contents: Read on alex0310/fptn-client-rs only.
          token: ${{ secrets.FPTN_RS_TOKEN }}

      - name: Overlay packages into OpenWrt tree
        run: cp -a package/. openwrt/package/

      - name: Install Rust (nightly + rust-src), cargo-zigbuild and zig
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          cargo +nightly install cargo-zigbuild --locked
          ZIG_VERSION=0.14.1
          mkdir -p "$HOME/opt"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C "$HOME/opt"
          echo "ZIG_DIR=$HOME/opt/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_ENV"

      - name: Cross-build and stage Rust client
        working-directory: fptn-rs
        run: |
          scripts/stage-openwrt.sh \
            "$GITHUB_WORKSPACE/openwrt/package/openwrt-fptn/fptn-client-rs"

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          sed -i 's/PKG_BUILD_FLAGS:=no-mips16 gc-sections lto/PKG_BUILD_FLAGS:=no-mips16 gc-sections/' feeds/packages/libs/boost/Makefile
          sed -i 's/$(if $(CONFIG_PACKAGE_boost-locale),boost.locale.std=off boost.locale.posix=off)/$(if $(CONFIG_PACKAGE_boost-locale),boost.locale.icu=off boost.locale.std=on boost.locale.posix=on)/' feeds/packages/libs/boost/Makefile
          ./scripts/feeds install -a

      - name: Configure
        working-directory: openwrt
        run: |
          cp ../ci-lean4c.config .config
          make defconfig
          sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\(.*\)"/target arch: \1/p' .config
          # Fail fast: a bad .config used to reach the very last step and then be
          # skipped by `|| exit 0`, i.e. a green run with no image at all. Checking
          # here costs seconds instead of a ~50 min build.
          if ! grep -qF 'CONFIG_TARGET_ramips_mt76x8_DEVICE_xiaomi_mi-router-4c=y' .config; then
            echo "::error::xiaomi_mi-router-4c is not selected after 'make defconfig'; no image would be built. Device/profile selection is now:"
            grep -E '^CONFIG_TARGET(_DEVICE)?_[A-Za-z0-9_-]+=y|^CONFIG_TARGET_PROFILE=' .config \
              || echo "  (nothing selected at all)"
            exit 1
          fi
          grep -qF 'CONFIG_PACKAGE_fptn-client-rs=y' .config || {
            echo "::error::CONFIG_PACKAGE_fptn-client-rs is not set after 'make defconfig'; the image would not contain the client."
            exit 1
          }
          echo "device: $(grep -m1 '^CONFIG_TARGET_PROFILE=' .config)"

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dllean-${{ env.OPENWRT_COMMIT }}-${{ hashFiles('package/**/Makefile') }}
          restore-keys: |
            dl-

      - name: Build toolchain
        working-directory: openwrt
        run: |
          make tools/install -j"$(nproc)"
          make toolchain/install -j"$(nproc)"

      - name: Build kernel
        working-directory: openwrt
        run: |
          make target/linux/compile -j"$(nproc)"
          make package/kernel/linux/compile -j"$(nproc)"

      - name: Build fptn packages
        working-directory: openwrt
        run: |
          make package/openwrt-fptn/fptn-client-rs/compile -j"$(nproc)" V=sc

      - name: Build image (lean)
        working-directory: openwrt
        run: |
          set -eu
          # Defensive re-check (Configure already fails fast on this). Never skip
          # silently: `|| exit 0` here is exactly what turned a broken config into
          # a green run with no image at all.
          grep -qF 'CONFIG_TARGET_ramips_mt76x8_DEVICE_xiaomi_mi-router-4c=y' .config || {
            echo "::error::xiaomi_mi-router-4c is no longer selected in .config; refusing to skip the build silently."
            exit 1
          }
          # срезаем boost/googletest и сервисы для замера минимального образа
          for p in boost googletest dnsmasq dropbear firewall4 hostapd-common wpad-basic-mbedtls wireless-regdb; do
            sed -i "s/^CONFIG_PACKAGE_${p}=.*/CONFIG_PACKAGE_${p}=n/" .config
          done
          sed -i 's/^\(CONFIG_PACKAGE_boost-[^=]*\)=.*/\1=n/' .config
          make defconfig
          make -j"$(nproc)" V=sc
          mkdir -p ../dist-img
          find bin/targets/ramips/mt76x8 -maxdepth 1 -type f \
            -name '*xiaomi_mi-router-4c*' -exec cp {} ../dist-img/ \;
          echo "=== built images ==="
          ls -la ../dist-img
          if [ -z "$(ls -A ../dist-img 2>/dev/null)" ]; then
            echo "::error::no xiaomi_mi-router-4c image was produced. bin/targets/ramips/mt76x8 contains:"
            ls -la bin/targets/ramips/mt76x8 || echo "  (missing — build produced nothing for this target)"
            exit 1
          fi
          echo "=== bin/targets/ramips/mt76x8 ==="
          ls -la bin/targets/ramips/mt76x8
          echo "=== root squashfs size ==="
          ls -la build_dir/target-mipsel_24kc_musl/linux-ramips_mt76x8/root.squashfs || true
          du -h build_dir/target-mipsel_24kc_musl/linux-ramips_mt76x8/root.squashfs || true

      - name: Upload experiment image
        uses: actions/upload-artifact@v4
        with:
          name: image-lean4c
          path: dist-img/*
          if-no-files-found: error